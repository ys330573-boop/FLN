<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 294">
  <!-- T1 mug: glossy blue plastic measuring mug - pouring spout on the left, open hook handle on the right
       (drawn for MTG2A04_L03_S01) -->
  <defs>
    <linearGradient id="mBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E78DE"/>
      <stop offset="0.2" stop-color="#4291F2"/>
      <stop offset="0.55" stop-color="#55A1F8"/>
      <stop offset="0.72" stop-color="#7DBAFF"/>
      <stop offset="0.88" stop-color="#56A0F6"/>
      <stop offset="1" stop-color="#3380E4"/>
    </linearGradient>
    <linearGradient id="mShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#1A5CC0" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A5CC0" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="mIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2463C6"/>
      <stop offset="1" stop-color="#4F9CF3"/>
    </linearGradient>
    <linearGradient id="mRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5AA2F4"/>
      <stop offset="0.55" stop-color="#A6D2FF"/>
      <stop offset="1" stop-color="#5598EE"/>
    </linearGradient>
    <linearGradient id="mHandle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3F8BEE"/>
      <stop offset="0.45" stop-color="#72B3FD"/>
      <stop offset="1" stop-color="#2F7BE0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="mClip"><path d="M68 62 L78 256 C80 280 120 292 180 292 C240 292 280 280 282 256 L292 62 Z"/></clipPath>
  </defs>
  <!-- handle (behind the body): out from under the rim, then straight down, open end -->
  <path d="M268 78 C318 66 350 74 352 112 L350 230" fill="none" stroke="url(#mHandle)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 72 C330 70 340 84 341 112 L339 222" fill="none" stroke="#B4DAFF" stroke-width="5" stroke-linecap="round" opacity=".5" filter="url(#soft)"/>
  <!-- body -->
  <path d="M68 62 L78 256 C80 280 120 292 180 292 C240 292 280 280 282 256 L292 62 Z" fill="url(#mBody)"/>
  <g clip-path="url(#mClip)">
    <rect x="0" y="0" width="380" height="300" fill="url(#mShade)"/>
    <path d="M214 84 L236 84 L230 280 L212 280 Z" fill="#E4F1FF" opacity=".5" filter="url(#soft)"/>
    <path d="M78 70 L92 70 L102 280 L92 280 Z" fill="#164FAE" opacity=".2" filter="url(#soft)"/>
  </g>
  <!-- rim with the pouring spout flowing out of it on the left -->
  <!-- under the spout: the wall leans out to carry it (no floating lip) -->
  <path d="M70 66 C56 64 40 60 26 58 C40 66 56 80 74 108 Z" fill="url(#mBody)"/>
  <path d="M70 66 C56 64 40 60 26 58 C40 66 56 80 74 108 Z" fill="#1A5CC0" opacity=".18"/>
  <!-- rim + spout as ONE outline: the lip flows out of the rim into the spout tip -->
  <path d="M12 54 C34 46 70 48.6 110 42.1 A116 25 0 1 1 100 80.1 C74 74.8 40 66 12 54 Z" fill="url(#mRim)"/>
  <!-- the opening, its channel running into the spout -->
  <path d="M28 54 C44 52 72 56.2 108 49.6 A104 19 0 1 1 100 74.7 C78 69.6 50 62 28 54 Z" fill="url(#mIn)"/>
  <path d="M14 55 C40 66 72 78 100 81" fill="none" stroke="#2F7BE0" stroke-width="1.6" opacity=".45"/>
  <path d="M74 72 Q180 102 288 70" fill="none" stroke="#B7DBFF" stroke-width="2.6" opacity=".7"/>
</svg>
